[package]
name = "capture"
version = "0.1.0"
edition = "2024"

[lib]
name = "capture"
path = "src/lib.rs"

[[bin]]
name = "capture"
path = "src/main.rs"

[[bin]]
name = "capture-gui"
path = "src/bin/capture-gui.rs"

[dependencies]
image = "0"
enigo = "0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0"
screenshots = "0"
serde_json = "1"
eframe = "0"
egui = "0"
chrono = "0"
rfd = "0"
log = "0"
env_logger = "0"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0"
core-foundation = "0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }
